<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Manhwa</title>

<link rel="stylesheet" href="style.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding-bottom:85px;
  color:#171717;
}

.home-header{
  padding:18px 16px 10px;
}

.top-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.app-logo{
  font-size:23px;
  font-weight:800;
}

.settings-btn{
  border:0;
  background:none;
  font-size:24px;
  cursor:pointer;
}

.search-box{
  margin-top:15px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:15px;
  outline:none;
  background:white;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 0 5px;
}

.categories button{
  border:1px solid #ddd;
  background:white;
  border-radius:20px;
  padding:9px 15px;
  white-space:nowrap;
  font-weight:bold;
}

.categories button.active{
  background:#171717;
  color:white;
}

.home{
  padding:0 16px;
  max-width:1000px;
  margin:auto;
}

.section{
  margin-top:20px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title button{
  border:0;
  background:none;
  font-weight:bold;
}

.obras-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.obra-card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
}

.obra-capa{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}

.obra-info{
  padding:9px;
}

.obra-info h3{
  margin:2px 0 5px;
  font-size:14px;
}

.obra-info small{
  color:#777;
  font-size:11px;
}

.empty-obras{
  padding:30px 15px;
  text-align:center;
  background:white;
  border:1px dashed #ccc;
  border-radius:16px;
  color:#888;
}

.minhu-box{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:17px;
  padding:16px;
}

.minhu-box h3{
  margin:0 0 6px;
}

.minhu-box p{
  margin:0 0 12px;
  color:#777;
  font-size:14px;
}

.minhu-box button{
  border:0;
  background:#171717;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-weight:bold;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  border:0;
  background:none;
  color:#777;
  font-size:21px;
  cursor:pointer;
}

.bottom small{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.bottom .active{
  color:#111;
  font-weight:bold;
}

@media(max-width:500px){
  .obras-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header class="home-header">

  <div class="top-line">

    <div class="app-logo">
      ✦ Meu Manhwa
    </div>

    <button
      class="settings-btn"
      onclick="location.href='configuracoes.html'"
    >
      ⚙️
    </button>

  </div>

  <div class="search-box">

    <input
      id="pesquisa"
      type="search"
      placeholder="Pesquisar obras..."
      oninput="filtrarObras()"
    >

  </div>

  <div class="categories">

    <button
      class="active"
      onclick="filtrarCategoria('Todos',this)"
    >
      Todos
    </button>

    <button
      onclick="filtrarCategoria('Manhwa',this)"
    >
      Manhwa
    </button>

    <button
      onclick="filtrarCategoria('Manhua',this)"
    >
      Manhua
    </button>

    <button
      onclick="filtrarCategoria('Mangá',this)"
    >
      Mangá
    </button>

    <button
      onclick="filtrarCategoria('Novel',this)"
    >
      Novel
    </button>

  </div>

</header>


<main class="home">

  <section class="section">

    <div class="section-title">
      <h2>📚 Obras</h2>
    </div>

    <div
      class="obras-grid"
      id="obrasCatalogo"
    ></div>

  </section>


  <section class="section">

    <div class="section-title">
      <h2>⭐ Em destaque</h2>
    </div>

    <div
      class="obras-grid"
      id="obrasDestaque"
    ></div>

  </section>


  <section class="section">

    <div class="section-title">
      <h2>🌶️ Minhu</h2>
    </div>

    <div class="minhu-box">

      <h3>Publicações</h3>

      <p>
        Veja fotos e vídeos publicados no seu perfil.
      </p>

      <button onclick="location.href='feed.html'">
        Abrir Minhu →
      </button>

    </div>

  </section>

</main>


<nav class="bottom">

  <button class="active">
    ⌂
    <small>Início</small>
  </button>

  <button onclick="location.href='feed.html'">
    🌶️
    <small>Minhu</small>
  </button>

  <button onclick="location.href='descobrir.html'">
    ◈
    <small>Descobrir</small>
  </button>

  <button onclick="location.href='estudio.html'">
    ▣
    <small>Meu Estúdio</small>
  </button>

  <button onclick="location.href='perfil.html'">
    ♙
    <small>Perfil</small>
  </button>

</nav>


<script>

let categoriaAtual="Todos";


function carregarObras(){

  const obras=
    JSON.parse(
      localStorage.getItem("minhas_obras") || "[]"
    );

  mostrarObras(obras);

}


function mostrarObras(obras){

  const catalogo=
    document.getElementById("obrasCatalogo");

  const destaque=
    document.getElementById("obrasDestaque");


  if(obras.length===0){

    catalogo.innerHTML=`
      <div class="empty-obras"
           style="grid-column:1/-1">

        📚

        <br><br>

        Você ainda não criou nenhuma obra.

        <br>

        Crie uma obra no Meu Estúdio
        para ela aparecer aqui.

      </div>
    `;

    destaque.innerHTML="";

    return;

  }


  catalogo.innerHTML="";


  obras.forEach(function(obra){

    catalogo.appendChild(criarCard(obra));

  });


  destaque.innerHTML="";


  obras.slice(0,3).forEach(function(obra){

    destaque.appendChild(criarCard(obra));

  });

}


function criarCard(obra){

  const card=
    document.createElement("div");

  card.className="obra-card";


  const capa=
    obra.capa
    ?
    `<img
      class="obra-capa"
      src="${obra.capa}"
      alt="${escapeHTML(obra.titulo)}"
    >`
    :
    `<div class="obra-capa">
      📖
    </div>`;


  card.innerHTML=`

    ${capa}

    <div class="obra-info">

      <small>
        ${escapeHTML(obra.tipo || "")}
      </small>

      <h3>
        ${escapeHTML(obra.titulo)}
      </h3>

      <small>
        ${escapeHTML(obra.generos || "")}
      </small>

    </div>

  `;


  card.onclick=function(){

    localStorage.setItem(
      "obraSelecionada",
      JSON.stringify(obra)
    );

    alert(
      "Obra selecionada: " +
      obra.titulo
    );

  };


  return card;

}


function filtrarCategoria(categoria,button){

  categoriaAtual=categoria;


  document
    .querySelectorAll(".categories button")
    .forEach(function(btn){

      btn.classList.remove("active");

    });


  button.classList.add("active");

  filtrarObras();

}


function filtrarObras(){

  const texto=
    document
      .getElementById("pesquisa")
      .value
      .toLowerCase()
      .trim();


  const obras=
    JSON.parse(
      localStorage.getItem("minhas_obras") || "[]"
    );


  const filtradas=
    obras.filter(function(obra){

      const combinaCategoria=
        categoriaAtual==="Todos" ||
        obra.tipo===categoriaAtual;


      const combinaPesquisa=
        !texto ||
        String(obra.titulo || "")
          .toLowerCase()
          .includes(texto) ||

        String(obra.generos || "")
          .toLowerCase()
          .includes(texto) ||

        String(obra.introducao || "")
          .toLowerCase()
          .includes(texto);


      return combinaCategoria &&
             combinaPesquisa;

    });


  mostrarObras(filtradas);

}


function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}


carregarObras();

</script>

</body>
  </html>
