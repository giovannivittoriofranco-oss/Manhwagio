<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Estúdio</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#171717;
padding-bottom:85px
}

header{
height:64px;
display:flex;
align-items:center;
padding:0 18px;
border-bottom:1px solid #eee;
gap:15px;
position:sticky;
top:0;
background:#fff;
z-index:5
}

.back{
border:0;
background:none;
font-size:28px;
cursor:pointer
}

header h1{
font-size:20px;
margin:0
}

main{
max-width:800px;
margin:auto;
padding:20px
}

.studio-tabs{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:20px;
padding-bottom:3px
}

.studio-tabs button{
border:1px solid #ddd;
background:#fff;
border-radius:13px;
padding:11px 16px;
font-weight:bold;
white-space:nowrap
}

.studio-tabs button.active{
background:#171717;
color:#fff;
border-color:#171717
}

.section{
display:none
}

.section.active{
display:block
}

.add{
width:100%;
padding:17px;
border:0;
border-radius:16px;
background:#171717;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.obras{
margin-top:25px
}

.obra{
border:1px solid #e5e5e5;
border-radius:18px;
padding:12px;
margin-bottom:15px;
display:flex;
gap:14px;
background:white
}

.obra img{
width:90px;
height:125px;
object-fit:cover;
border-radius:12px;
background:#eee
}

.obra-info{
flex:1
}

.obra-info h3{
margin:5px 0 8px
}

.obra-info p{
color:#777;
font-size:14px
}

.draft{
border:1px solid #e5e5e5;
border-radius:18px;
padding:16px;
margin-bottom:12px;
background:#fff
}

.draft-title{
font-weight:bold;
font-size:16px
}

.draft-info{
color:#777;
font-size:13px;
margin-top:6px
}

.draft-buttons{
display:flex;
gap:8px;
margin-top:12px
}

.draft-buttons button{
flex:1;
border:1px solid #ddd;
background:#fff;
border-radius:10px;
padding:10px;
font-weight:bold
}

.publish-card{
border:1px solid #e5e5e5;
border-radius:20px;
padding:18px;
background:#fff
}

.media-preview{
width:100%;
max-width:420px;
aspect-ratio:4/5;
margin:12px auto;
border-radius:16px;
background:#f1f1f1;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:#888
}

.media-preview img,
.media-preview video{
width:100%;
height:100%;
object-fit:cover
}

.media-buttons{
display:flex;
gap:8px;
margin-top:10px
}

.media-buttons button{
flex:1;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
background:#fff;
font-weight:bold;
cursor:pointer
}

.publish-actions{
display:flex;
gap:10px;
margin-top:15px
}

.publish-actions button{
flex:1;
padding:14px;
border:0;
border-radius:13px;
font-weight:bold
}

.draft-btn{
background:#eee
}

.publish-btn{
background:#171717;
color:#fff
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:20;
overflow:auto
}

.box{
background:white;
width:92%;
max-width:600px;
margin:30px auto;
padding:22px;
border-radius:22px
}

.box h2{
margin-top:0
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin-top:15px;
margin-bottom:6px
}

input,
textarea,
select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px
}

textarea{
min-height:100px;
resize:vertical
}

.preview{
width:120px;
height:160px;
border-radius:12px;
background:#f1f1f1;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-top:8px
}

.preview img{
width:100%;
height:100%;
object-fit:cover
}

.actions{
display:flex;
gap:10px;
margin-top:20px
}

.actions button{
flex:1;
padding:14px;
border:0;
border-radius:13px;
font-weight:bold
}

.cancel{
background:#eee
}

.save{
background:#171717;
color:white
}

.empty{
text-align:center;
padding:45px 15px;
color:#888;
border:1px dashed #ccc;
border-radius:18px
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom button{
border:0;
background:none;
color:#777;
font-size:21px;
cursor:pointer
}

.bottom small{
display:block;
font-size:10px;
margin-top:3px
}

.bottom .active{
color:#111;
font-weight:bold
}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">←</button>
<h1>Meu Estúdio</h1>
</header>

<main>

<div class="studio-tabs">

<button class="active" onclick="abrirAba('obras',this)">
📚 Obras
</button>

<button onclick="abrirAba('rascunhos',this)">
📝 Rascunhos
</button>

<button onclick="abrirAba('publicar',this)">
📤 Publicar
</button>

</div>

<section class="section active" id="obrasSection">

<button class="add" onclick="abrirFormulario()">
＋ Adicionar Nova Obra
</button>

<div class="obras" id="obras"></div>

</section>

<section class="section" id="rascunhosSection">
<div id="rascunhos"></div>
</section>

<section class="section" id="publicarSection">

<div class="publish-card">

<h2>Nova publicação</h2>

<p style="color:#777;font-size:13px">
Publique uma imagem ou vídeo no seu perfil.
</p>

<div class="media-preview" id="mediaPreview">
Escolha uma imagem ou vídeo
</div>

<div class="media-buttons">

<button type="button" onclick="document.getElementById('imagemPost').click()">
🖼️ Imagem
</button>

<button type="button" onclick="document.getElementById('videoPost').click()">
🎥 Vídeo
</button>

</div>

<input
type="file"
id="imagemPost"
accept="image/*"
style="display:none"
onchange="selecionarImagem(event)"
>

<input
type="file"
id="videoPost"
accept="video/*,.mp4,.webm,.mov,.m4v"
style="display:none"
onchange="selecionarVideo(event)"
>

<label>Legenda</label>

<textarea
id="legendaPost"
placeholder="Escreva uma legenda para sua publicação..."
></textarea>

<div class="publish-actions">

<button class="draft-btn" onclick="salvarRascunho()">
📝 Salvar rascunho
</button>

<button class="publish-btn" onclick="publicarPost()">
📤 Publicar
</button>

</div>

</div>

</section>

</main>

<div class="modal" id="modal">

<div class="box">

<h2>Nova obra</h2>

<label>Tipo</label>

<select id="tipo">
<option>Manhwa</option>
<option>Manhua</option>
<option>Mangá</option>
<option>Novel</option>
</select>

<label>Título</label>

<input
id="titulo"
placeholder="Nome da obra"
>

<label>Introdução</label>

<textarea
id="introducao"
placeholder="Uma breve introdução"
></textarea>

<label>Descrição</label>

<textarea
id="descricao"
placeholder="Descrição da história"
></textarea>

<label>Gêneros</label>

<input
id="generos"
placeholder="Romance, BL, Drama..."
>

<label>Classificação</label>

<select id="idade">
<option>Livre</option>
<option>10 anos</option>
<option>12 anos</option>
<option>14 anos</option>
<option>16 anos</option>
<option>18 anos</option>
</select>

<label>Capa</label>

<input
type="file"
id="capa"
accept="image/*"
onchange="mostrarCapa(event)"
>

<div class="preview" id="preview">
Capa
</div>

<div class="actions">

<button class="cancel" onclick="fecharFormulario()">
Cancelar
</button>

<button class="save" onclick="salvarObra()">
Salvar obra
</button>

</div>

</div>
</div>

<nav class="bottom">

<button onclick="location.href='index.html'">
⌂
<small>Início</small>
</button>

<button onclick="location.href='feed.html'">
♧
<small>Feed</small>
</button>

<button onclick="location.href='descobrir.html'">
◈
<small>Descobrir</small>
</button>

<button class="active">
▣
<small>Meu Estúdio</small>
</button>

<button onclick="location.href='perfil.html'">
♙
<small>Perfil</small>
</button>

</nav>

<script>

let capaAtual="";
let mediaPostAtual="";
let tipoMediaPost="";

/* ABAS */

function abrirAba(aba,button){

document.querySelectorAll(".studio-tabs button")
.forEach(function(btn){
btn.classList.remove("active");
});

button.classList.add("active");

document.querySelectorAll(".section")
.forEach(function(section){
section.classList.remove("active");
});

if(aba==="obras"){

document.getElementById("obrasSection")
.classList.add("active");

mostrarObras();

}

if(aba==="rascunhos"){

document.getElementById("rascunhosSection")
.classList.add("active");

mostrarRascunhos();

}

if(aba==="publicar"){

document.getElementById("publicarSection")
.classList.add("active");

}

}

/* OBRAS */

function abrirFormulario(){

document.getElementById("modal").style.display="block";

}

function fecharFormulario(){

document.getElementById("modal").style.display="none";

}

function mostrarCapa(event){

const arquivo=event.target.files[0];

if(!arquivo)return;

const leitor=new FileReader();

leitor.onload=function(e){

capaAtual=e.target.result;

document.getElementById("preview").innerHTML=
'<img src="'+capaAtual+'">';

};

leitor.readAsDataURL(arquivo);

}

function salvarObra(){

const titulo=
document.getElementById("titulo").value.trim();

if(!titulo){

alert("Digite o título da obra.");

return;

}

const obra={

id:Date.now(),

tipo:document.getElementById("tipo").value,

titulo:titulo,

introducao:
document.getElementById("introducao").value,

descricao:
document.getElementById("descricao").value,

generos:
document.getElementById("generos").value,

idade:
document.getElementById("idade").value,

capa:capaAtual,

data:Date.now()

};

const obras=
JSON.parse(
localStorage.getItem("minhas_obras")||"[]"
);

obras.push(obra);

localStorage.setItem(
"minhas_obras",
JSON.stringify(obras)
);

fecharFormulario();

limparFormulario();

mostrarObras();

alert("Obra salva com sucesso!");

}

function mostrarObras(){

const obras=
JSON.parse(
localStorage.getItem("minhas_obras")||"[]"
);

const container=
document.getElementById("obras");

if(obras.length===0){

container.innerHTML=
'<div class="empty">Você ainda não criou nenhuma obra.</div>';

return;

}

container.innerHTML="";

obras.forEach(obra=>{

const div=document.createElement("div");

div.className="obra";

div.innerHTML=`

${
obra.capa
?
'<img src="'+obra.capa+'">'
:
'<div style="width:90px;height:125px;border-radius:12px;background:#eee;display:flex;align-items:center;justify-content:center">♡</div>'
}

<div class="obra-info">

<small>${escapeHTML(obra.tipo)}</small>

<h3>${escapeHTML(obra.titulo)}</h3>

<p>
${escapeHTML(
obra.introducao||
obra.descricao||
"Sem descrição."
)}
</p>

<small>
${escapeHTML(obra.generos||"")}
</small>

</div>
`;

container.appendChild(div);

});

}

function limparFormulario(){

document.getElementById("titulo").value="";
document.getElementById("introducao").value="";
document.getElementById("descricao").value="";
document.getElementById("generos").value="";
document.getElementById("capa").value="";
document.getElementById("preview").innerHTML="Capa";

capaAtual="";

}

/* PUBLICAÇÃO */

function selecionarImagem(event){

const arquivo=event.target.files[0];

if(!arquivo)return;

tipoMediaPost="image";

const leitor=new FileReader();

leitor.onload=function(e){

mediaPostAtual=e.target.result;

document.getElementById("mediaPreview").innerHTML=
'<img src="'+mediaPostAtual+'">';

};

leitor.readAsDataURL(arquivo);

}

function selecionarVideo(event){

const arquivo=event.target.files[0];

if(!arquivo)return;

tipoMediaPost="video";

const leitor=new FileReader();

leitor.onload=function(e){

mediaPostAtual=e.target.result;

document.getElementById("mediaPreview").innerHTML=
'<video src="'+mediaPostAtual+'" controls playsinline></video>';

};

leitor.readAsDataURL(arquivo);

}

/* RASCUNHO */

function salvarRascunho(){

const legenda=
document.getElementById("legendaPost").value.trim();

if(!mediaPostAtual && !legenda){

alert("Adicione uma mídia ou escreva uma legenda.");

return;

}

const rascunho={

id:Date.now(),

type:tipoMediaPost,

media:mediaPostAtual,

caption:legenda,

data:Date.now()

};

const rascunhos=
JSON.parse(
localStorage.getItem("meus_rascunhos")||"[]"
);

rascunhos.unshift(rascunho);

localStorage.setItem(
"meus_rascunhos",
JSON.stringify(rascunhos)
);

alert("Rascunho salvo!");

limparPublicacao();

mostrarRascunhos();

abrirAba(
"rascunhos",
document.querySelectorAll(".studio-tabs button")[1]
);

}

function mostrarRascunhos(){

const container=
document.getElementById("rascunhos");

const rascunhos=
JSON.parse(
localStorage.getItem("meus_rascunhos")||"[]"
);

if(rascunhos.length===0){

container.innerHTML=`

<div class="empty">

<div style="font-size:38px">📝</div>

<strong>Nenhum rascunho</strong>

<p>
Se você salvar uma publicação antes de publicar,
ela aparecerá aqui.
</p>

</div>

`;

return;

}

container.innerHTML="";

rascunhos.forEach(function(rascunho,index){

const div=document.createElement("div");

div.className="draft";

div.innerHTML=`

<div class="draft-title">
📝 Rascunho ${index+1}
</div>

<div class="draft-info">

${rascunho.type==="video"?"🎥 Vídeo":"🖼️ Imagem"}

${
rascunho.caption
?
" · "+escapeHTML(
rascunho.caption.substring(0,80)
)
:
""
}

</div>

<div class="draft-buttons">

<button onclick="editarRascunho(${index})">
Editar
</button>

<button onclick="excluirRascunho(${index})">
Excluir
</button>

</div>

`;

container.appendChild(div);

});

}

function editarRascunho(index){

const rascunhos=
JSON.parse(
localStorage.getItem("meus_rascunhos")||"[]"
);

const rascunho=rascunhos[index];

if(!rascunho)return;

mediaPostAtual=rascunho.media||"";

tipoMediaPost=rascunho.type||"";

document.getElementById("legendaPost").value=
rascunho.caption||"";

if(rascunho.media){

if(rascunho.type==="video"){

document.getElementById("mediaPreview").innerHTML=
'<video src="'+rascunho.media+'" controls playsinline></video>';

}else{

document.getElementById("mediaPreview").innerHTML=
'<img src="'+rascunho.media+'">';

}

}

rascunhos.splice(index,1);

localStorage.setItem(
"meus_rascunhos",
JSON.stringify(rascunhos)
);

abrirAba(
"publicar",
document.querySelectorAll(".studio-tabs button")[2]
);

}

function excluirRascunho(index){

if(!confirm("Excluir este rascunho?"))return;

const rascunhos=
JSON.parse(
localStorage.getItem("meus_rascunhos")||"[]"
);

rascunhos.splice(index,1);

localStorage.setItem(
"meus_rascunhos",
JSON.stringify(rascunhos)
);

mostrarRascunhos();

}

/* PUBLICAR */

function publicarPost(){

if(!mediaPostAtual){

alert("Escolha uma imagem ou vídeo.");

return;

}

const post={

id:Date.now(),

type:tipoMediaPost,

media:mediaPostAtual,

caption:
document.getElementById("legendaPost").value.trim(),

likes:0,

liked:false,

hideLikes:false,

data:Date.now(),

author:
localStorage.getItem("profileName")||"Meu Perfil"

};

const posts=
JSON.parse(
localStorage.getItem("minhas_publicacoes")||"[]"
);

posts.unshift(post);

localStorage.setItem(
"minhas_publicacoes",
JSON.stringify(posts)
);

alert("Publicação feita com sucesso!");

limparPublicacao();

}

/* LIMPAR */

function limparPublicacao(){

mediaPostAtual="";
tipoMediaPost="";

document.getElementById("imagemPost").value="";
document.getElementById("videoPost").value="";
document.getElementById("legendaPost").value="";

document.getElementById("mediaPreview").innerHTML=
"Escolha uma imagem ou vídeo";

}

/* SEGURANÇA */

function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

});

}

/* INICIAR */

mostrarObras();
mostrarRascunhos();

</script>

</body>
  </html>
