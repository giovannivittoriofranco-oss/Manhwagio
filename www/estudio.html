<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Estúdio</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#171717;
padding-bottom:85px
}

header{
height:64px;
display:flex;
align-items:center;
padding:0 18px;
border-bottom:1px solid #eee;
gap:15px;
position:sticky;
top:0;
background:#fff;
z-index:5
}

.back{
border:0;
background:none;
font-size:28px;
cursor:pointer
}

header h1{
font-size:20px;
margin:0
}

main{
max-width:800px;
margin:auto;
padding:20px
}

.add{
width:100%;
padding:17px;
border:0;
border-radius:16px;
background:#171717;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.obras{
margin-top:25px
}

.obra{
border:1px solid #e5e5e5;
border-radius:18px;
padding:12px;
margin-bottom:15px;
display:flex;
gap:14px;
background:white
}

.obra img{
width:90px;
height:125px;
object-fit:cover;
border-radius:12px;
background:#eee
}

.obra-info{
flex:1
}

.obra-info h3{
margin:5px 0 8px
}

.obra-info p{
color:#777;
font-size:14px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:20;
overflow:auto
}

.box{
background:white;
width:92%;
max-width:600px;
margin:30px auto;
padding:22px;
border-radius:22px
}

.box h2{
margin-top:0
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin-top:15px;
margin-bottom:6px
}

input,textarea,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px
}

textarea{
min-height:100px;
resize:vertical
}

.preview{
width:120px;
height:160px;
border-radius:12px;
background:#f1f1f1;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-top:8px
}

.preview img{
width:100%;
height:100%;
object-fit:cover
}

.actions{
display:flex;
gap:10px;
margin-top:20px
}

.actions button{
flex:1;
padding:14px;
border:0;
border-radius:13px;
font-weight:bold
}

.cancel{
background:#eee
}

.save{
background:#171717;
color:white
}

.empty{
text-align:center;
padding:45px 15px;
color:#888
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom button{
border:0;
background:none;
color:#777;
font-size:21px
}

.bottom small{
display:block;
font-size:10px;
margin-top:3px
}

.bottom .active{
color:#111;
font-weight:bold
}
</style></head><body><header>
<button class="back" onclick="history.back()">←</button>
<h1>Meu Estúdio</h1>
</header><main><button class="add" onclick="abrirFormulario()">
＋ Adicionar Nova Obra
</button><div class="obras" id="obras"></div></main><div class="modal" id="modal"><div class="box"><h2>Nova obra</h2><label>Tipo</label>
<select id="tipo">

<option>Manhwa</option>
<option>Manhua</option>
<option>Mangá</option>
<option>Novel</option>
</select><label>Título</label>
<input id="titulo" placeholder="Nome da obra">

<label>Introdução</label>

<textarea id="introducao" placeholder="Uma breve introdução"></textarea><label>Descrição</label>

<textarea id="descricao" placeholder="Descrição da história"></textarea><label>Gêneros</label>
<input id="generos" placeholder="Romance, BL, Drama...">

<label>Classificação</label>
<select id="idade">

<option>Livre</option>
<option>10 anos</option>
<option>12 anos</option>
<option>14 anos</option>
<option>16 anos</option>
<option>18 anos</option>
</select><label>Capa</label>
<input type="file" id="capa" accept="image/*" onchange="mostrarCapa(event)">

<div class="preview" id="preview">
Capa
</div><div class="actions">
<button class="cancel" onclick="fecharFormulario()">Cancelar</button>
<button class="save" onclick="salvarObra()">Salvar obra</button>
</div></div>
</div><nav class="bottom"><button onclick="location.href='index.html'">
⌂
<small>Início</small>
</button><button onclick="location.href='feed.html'">
♧
<small>Feed</small>
</button><button onclick="location.href='descobrir.html'">
◈
<small>Descobrir</small>
</button><button class="active">
▣
<small>Meu Estúdio</small>
</button><button onclick="location.href='perfil.html'">
♙
<small>Perfil</small>
</button></nav><script>

let capaAtual="";

function abrirFormulario(){
document.getElementById("modal").style.display="block";
}

function fecharFormulario(){
document.getElementById("modal").style.display="none";
}

function mostrarCapa(event){

const arquivo=event.target.files[0];

if(!arquivo)return;

const leitor=new FileReader();

leitor.onload=function(e){

capaAtual=e.target.result;

document.getElementById("preview").innerHTML=
'<img src="'+capaAtual+'">';

};

leitor.readAsDataURL(arquivo);
}


function salvarObra(){

const titulo=document.getElementById("titulo").value.trim();

if(!titulo){
alert("Digite o título da obra.");
return;
}

const obra={

id:Date.now(),

tipo:document.getElementById("tipo").value,

titulo:titulo,

introducao:document.getElementById("introducao").value,

descricao:document.getElementById("descricao").value,

generos:document.getElementById("generos").value,

idade:document.getElementById("idade").value,

capa:capaAtual,

data:Date.now()

};

const obras=JSON.parse(localStorage.getItem("minhas_obras")||"[]");

obras.push(obra);

localStorage.setItem("minhas_obras",JSON.stringify(obras));

fecharFormulario();

limparFormulario();

mostrarObras();

alert("Obra salva com sucesso!");

}


function mostrarObras(){

const obras=JSON.parse(localStorage.getItem("minhas_obras")||"[]");

const container=document.getElementById("obras");

if(obras.length===0){

container.innerHTML=
'<div class="empty">Você ainda não criou nenhuma obra.</div>';

return;

}

container.innerHTML="";

obras.forEach(obra=>{

const div=document.createElement("div");

div.className="obra";

div.innerHTML=`

${obra.capa
? '<img src="'+obra.capa+'">'
: '<div style="width:90px;height:125px;border-radius:12px;background:#eee;display:flex;align-items:center;justify-content:center">♡</div>'
}

<div class="obra-info">

<small>${obra.tipo}</small>

<h3>${escapeHTML(obra.titulo)}</h3>

<p>${escapeHTML(obra.introducao||obra.descricao||"Sem descrição.")}</p>

<small>${escapeHTML(obra.generos||"")}</small>

</div>
`;

container.appendChild(div);

});

}


function limparFormulario(){

document.getElementById("titulo").value="";
document.getElementById("introducao").value="";
document.getElementById("descricao").value="";
document.getElementById("generos").value="";
document.getElementById("capa").value="";
document.getElementById("preview").innerHTML="Capa";

capaAtual="";

}


function escapeHTML(text){

return String(text).replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}


mostrarObras();

</script></body>
  </html>
